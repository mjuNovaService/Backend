spring:
  application:
    name: backend
  profiles:
    active: local

# JWT 공통 설정 (비밀키는 프로필별로 따로)
jwt:
  access-token-expiration: 30m
  refresh-token-expiration: 14d
  # Refresh Token 쿠키 설정. 프론트를 다른 사이트에 배포하면 same-site를 None으로 바꿈.
  cookie-secure: true
  cookie-same-site: Strict

# 이메일 인증 공통 설정
auth:
  email:
    allowed-domain: mju.ac.kr       # 이 도메인 이메일만 가입 가능
    code-expiration: 5m             # 인증코드 유효 시간 (발송 후)
    resend-cooldown: 60s            # 같은 이메일로 다시 보내려면 기다려야 하는 시간
    signup-window: 30m              # 인증 완료 후 회원가입까지 허용하는 시간 (회원가입 API에서 사용)

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5433/nova
    username: nova
    password: root1234
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# 로컬 개발용 비밀키. 실제 서비스에서는 사용 X
jwt:
  secret: ZNyDorFmM6Os7Mh0iwiW0TvFo3JACcRb5ZOjogT8dXUTjlRMl28mNOq0hzcjwE/z

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  # 메일 발송 (Gmail SMTP). 계정·앱 비밀번호는 배포 서버의 환경변수에 추가.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# 배포 서버의 환경변수로 받음
jwt:
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false