spring:
  application:
    name: backend
  profiles:
    active: local

# JWT 공통 설정 (비밀키는 프로필별로 따로)
jwt:
  access-token-expiration: 30m
  refresh-token-expiration: 14d
  # Refresh Token 쿠키 설정. 프론트를 다른 사이트에 배포하면 same-site를 None으로 바꿈.
  cookie-secure: true
  cookie-same-site: Strict

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5433/nova
    username: nova
    password: root1234
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# 로컬 개발용 비밀키. 실제 서비스에서는 사용 X
jwt:
  secret: ZNyDorFmM6Os7Mh0iwiW0TvFo3JACcRb5ZOjogT8dXUTjlRMl28mNOq0hzcjwE/z

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

# 배포 서버의 환경변수로 받음
jwt:
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false