spring:
  application:
    name: backend
  profiles:
    active: local
  # 파일 업로드 크기 (재학증명서 5MB + 나머지 입력값)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# JWT 공통 설정 (비밀키는 프로필별로 따로)
jwt:
  access-token-expiration: 30m
  refresh-token-expiration: 14d
  # Refresh Token 쿠키 설정. 프론트를 다른 사이트에 배포하면 same-site를 None으로 바꿈.
  cookie-secure: true
  cookie-same-site: Strict

# 이메일 인증 공통 설정
auth:
  email:
    allowed-domain: mju.ac.kr       # 이 도메인 이메일만 가입 가능
    code-expiration: 5m             # 인증코드 유효 시간 (발송 후)
    resend-cooldown: 60s            # 같은 이메일로 다시 보내려면 기다려야 하는 시간
    signup-window: 30m              # 인증 완료 후 회원가입까지 허용하는 시간 (회원가입 API에서 사용)
  # 회원가입 설정
  signup:
    allowed-college: 인공지능소프트웨어융합대학   # 재학증명서의 '대학' (공백·점을 뺀 이름으로 비교)
    initial-admin-email: ${INITIAL_ADMIN_EMAIL:}  # 이 이메일로 처음 가입한 계정이 회장 (비어 있으면 동작 안 함)
    certificate-dir: ./uploads                   # PENDING 재학증명서 저장 폴더 (S3로 바꾸기 전 임시)

# 재학증명서 OCR (Google Cloud Vision). 키가 비어 있으면 OCR을 건너뛰고 모두 PENDING
google:
  vision:
    api-key: ${GOOGLE_VISION_API_KEY:}

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5433/nova
    username: nova
    password: root1234
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    # Hibernate가 테이블을 만든 뒤에 schema.sql을 실행한다 (부분 유니크 인덱스는 테이블이 있어야 만들 수 있음)
    defer-datasource-initialization: true

  # TEMP(담당: 팀): schema.sql(부분 유니크 인덱스)은 local에서만 실행된다. prod는 ddl-auto: validate라 인덱스를 만들 방법이 없음 / prod 적용 방법(Flyway 등)이 정해지면 그쪽으로 옮기고 이 설정 삭제
  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# 로컬 개발용 비밀키. 실제 서비스에서는 사용 X
jwt:
  secret: ZNyDorFmM6Os7Mh0iwiW0TvFo3JACcRb5ZOjogT8dXUTjlRMl28mNOq0hzcjwE/z

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  # 메일 발송 (Gmail SMTP). 계정·앱 비밀번호는 배포 서버의 환경변수에 추가.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# 배포 서버의 환경변수로 받음
jwt:
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false