services:
  postgres:
    image: postgres:16
    container_name: nova-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: root1234
      POSTGRES_DB: nova
      POSTGRES_USER: nova
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - nova-postgres-data:/var/lib/postgresql/data

volumes:
  nova-postgres-data: