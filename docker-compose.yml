services:
  mysql:
    image: mysql:8.0
    container_name: nova-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: nova
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot1234" ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - nova-mysql-data:/var/lib/mysql

volumes:
  nova-mysql-data: